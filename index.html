  }
  button {
    background-color: #005f8f;

  }
  button:hover {

  <div class="section" id="images-section">
    <h2>Sea Condition Maps (Static)</h2>
    <div>
      <label>Parameter:</label>
      <select id="var-select">
        <option value="SSS">SSS (Surface Salinity)</option>
        <option value="BS">BS (Bottom Salinity)</option>
        <option value="SST">SST (Surface Temperature)</option>
        <option value="BT">BT (Bottom Temperature)</option>
        <option value="SVel">SVel (Surface Velocity)</option>
        <option value="BVel">BVel (Bottom Velocity)</option>
      </select>
    </div>
    <div>
      <label>Date & Time:</label>
      <select id="time-select"></select>
    </div>
    <div id="image-controls">
      <button id="prev-btn">PREV</button>
      <button id="next-btn">NEXT</button>

    <img id="display-img" src="" alt="Sea Condition Map">
  </div>

  <!-- 動画セクション -->

    <div>
      <label>Parameter:</label>
      <select id="video-select"></select>
    </div>
    <video id="display-video" controls></video>
  </div>

</main>

<footer>
  © 2025 UCHI Ocean Simulation Project — Ariake & Yatsushiro Sea

// -----------------------------
// 日時セレクト更新
// -----------------------------
function updateTimeSelector() {
  const timeSelect = document.getElementById("time-select");
  timeSelect.innerHTML = "";
  if (!imageData[currentVar]) return;
  imageData[currentVar].forEach((item, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = item.datetime;
    timeSelect.appendChild(opt);
  });
  currentIndex = 0;
  timeSelect.selectedIndex = 0;
}

// -----------------------------
// 画像更新
// -----------------------------
function updateImage() {
  const imgEl = document.getElementById("display-img");
  if (!imageData[currentVar] || imageData[currentVar].length === 0) {
    imgEl.src = "";
    imgEl.alt = "No image available";
    return;
  }
  const item = imageData[currentVar][currentIndex];
  imgEl.src = item.path;
  document.getElementById("time-select").selectedIndex = currentIndex;
}
