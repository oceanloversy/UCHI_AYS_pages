<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDICTION of SEA CONDITIONS by UCHI in ARIAKE & YATSUSHIRO SEA</title>
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f8f9fa;
    margin: 0;
    text-align: center;
  }
  header {
    background: linear-gradient(90deg, #004e92, #000428);
    color: white;
    padding: 1.2rem;
    font-size: 1.4rem;
    font-weight: bold;
  }
  .container {
    margin: 1.5rem auto;
    width: 95%;
    max-width: 900px;
  }
  select, button {
    margin: 0.5rem;
    padding: 0.5rem;
    font-size: 1rem;
  }
  img, video {
    width: 100%;
    height: auto;
    max-height: 80vh;
    border: 2px solid #ccc;
    border-radius: 10px;
    background: white;
  }
  .btn-group {
    margin-top: 0.8rem;
  }
  #mode-buttons button {
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0.6rem 1rem;
    margin: 0.3rem;
    cursor: pointer;
  }
  #mode-buttons button.active {
    background-color: #0056b3;
  }
  @media (max-width: 600px) {
    #velocityNoteImage, #velocityNoteVideo {
      font-size: 12px;
    }
  }
</style>
</head>

<body>
<header>PREDICTION of SEA CONDITIONS by UCHI in ARIAKE & YATSUSHIRO SEA</header>

<div class="container">
  <div id="mode-buttons">
    <button id="imageModeBtn" class="active">静止画像</button>
    <button id="videoModeBtn">動画</button>
  </div>

  <!-- ========================= -->
  <!-- 静止画像モード -->
  <!-- ========================= -->
  <div id="imageMode">
    <div>
      <label>項目：</label>
      <select id="imageVar">
        <option value="SSS">SSS(Sea Surface Salinity)</option>
        <option value="BS">BS(Bottom Salinity)</option>
        <option value="SST">SST(Sea Surface Temperature)</option>
        <option value="BT">BT(Bottom Temperature)</option>
        <option value="SVel">SVel(Surface Current)</option>
        <option value="BVel">BVel(Bottom Current)</option>
      </select>
      <br>
      <label>日時：</label>
      <select id="imageTime"></select>
      <br>

      <!-- ズームレベル（SVel/BVel時のみ表示） -->
      <div id="zoomContainer" style="display:none; margin-top:0.5rem;">
        <label>ズームレベル：</label>
        <select id="zoomLevel">
          <option value="_z1">粗</option>
          <option value="_z2">中</option>
          <option value="_z3">細</option>
          <option value="_z4">最密</option>
        </select>
      </div>
    </div>

    <div class="btn-group">
      <button id="prevBtn">PREV</button>
      <button id="nextBtn">NEXT</button>
    </div>

    <!-- 静止画像＋注記 -->
    <div id="imageContainer" style="position:relative; display:flex; justify-content:center;">
      <img id="displayImage" src="" alt="Sea Condition Image" style="max-width:100%; height:auto;">
      <div id="velocityNoteImage"
           style="position:absolute; top:30px; right:90px; color:red; font-size:14px; font-weight:bold; display:none;">
        赤矢印は流速0.5m/s以上
      </div>
    </div>
  </div>

  <!-- ========================= -->
  <!-- 動画モード -->
  <!-- ========================= -->
  <div id="videoMode" style="display:none;">
    <div>
      <label>項目：</label>
      <select id="videoVar">
        <option value="SSS">SSS(Sea Surface Salinity)</option>
        <option value="BS">BS(Bottom Salinity)</option>
        <option value="SST">SST(Sea Surface Temperature)</option>
        <option value="BT">BT(Bottom Temperature)</option>
        <option value="SVel">SVel(Surface Current)</option>
        <option value="BVel">BVel(Bottom Current)</option>
      </select>
    </div>

    <!-- ズームレベル（SVel/BVel時のみ表示） -->
    <div id="zoomContainerVideo" style="display:none; margin-top:0.5rem;">
      <label>ズームレベル：</label>
      <select id="zoomLevelVideo">
        <option value="_z1">粗</option>
        <option value="_z2">中</option>
        <option value="_z3">細</option>
        <option value="_z4">最密</option>
      </select>
    </div>

    <!-- 動画＋注記 -->
    <div id="videoContainer" style="position:relative; display:flex; justify-content:center;">
      <video id="displayVideo" controls style="max-width:100%; height:auto;">
        <source src="" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div id="velocityNoteVideo"
           style="position:absolute; top:30px; right:90px; color:red; font-size:14px; font-weight:bold; display:none;">
        赤矢印は流速0.5m/s以上
      </div>
    </div>
  </div>
</div>

<!-- ========================= -->
<!-- スクリプト -->
<!-- ========================= -->
<script>
const imageVar = document.getElementById('imageVar');
const imageTime = document.getElementById('imageTime');
const displayImage = document.getElementById('displayImage');
const zoomContainer = document.getElementById('zoomContainer');
const zoomLevel = document.getElementById('zoomLevel');
let imageFiles = {};

// JSON読み込み
async function loadImageList() {
  try {
    const res = await fetch('image_list.json', { cache: 'no-store' });
    imageFiles = await res.json();
    populateTimeOptions();
    registerImageEvents();
  } catch (e) {
    console.warn('image_list.json not found. Please generate it.');
  }
}

// 日時プルダウン更新
function populateTimeOptions() {
  const varSel = imageVar.value;
  if (!imageFiles[varSel]) return;

  let entries = [];
  if (varSel === 'SVel' || varSel === 'BVel') {
    zoomContainer.style.display = 'block';
    const zoomKey = zoomLevel.value ? zoomLevel.value.replace('_', '') : 'z1';
    if (imageFiles[varSel][zoomKey]) {
      entries = imageFiles[varSel][zoomKey];
    }
  } else {
    zoomContainer.style.display = 'none';
    entries = imageFiles[varSel];
  }

  imageTime.innerHTML = '';
  entries.forEach(entry => {
    const opt = document.createElement('option');
    opt.value = entry.path;
    opt.textContent = entry.datetime;
    imageTime.appendChild(opt);
  });

  updateImage();
}

// 画像更新
function updateImage() {
  const varSel = imageVar.value;
  const path = imageTime.value;
  if (!path) return;
  displayImage.src = path;

  const note = document.getElementById('velocityNoteImage');
  note.style.display = (varSel === 'SVel' || varSel === 'BVel') ? 'block' : 'none';
}

// PREV/NEXT
document.getElementById('prevBtn').onclick = () => shiftImage(-1);
document.getElementById('nextBtn').onclick = () => shiftImage(1);
function shiftImage(offset) {
  const idx = imageTime.selectedIndex;
  const newIdx = idx + offset;
  if (newIdx >= 0 && newIdx < imageTime.options.length) {
    imageTime.selectedIndex = newIdx;
    updateImage();
  }
}

// イベント登録
function registerImageEvents() {
  imageVar.onchange = populateTimeOptions;
  imageTime.onchange = updateImage;
  zoomLevel.onchange = populateTimeOptions;
}

// =========================
// 動画モード
// =========================
const videoVar = document.getElementById('videoVar');
const displayVideo = document.getElementById('displayVideo');
const zoomContainerVideo = document.getElementById('zoomContainerVideo');
const zoomLevelVideo = document.getElementById('zoomLevelVideo');

function updateVideo() {
  const varSel = videoVar.value;
  let path = `mv/${varSel}.mp4`;
  if ((varSel === 'SVel' || varSel === 'BVel') && zoomLevelVideo.value) {
    path = `mv/${varSel}${zoomLevelVideo.value}.mp4`;
  }
  displayVideo.src = path;
  displayVideo.load();

  const note = document.getElementById('velocityNoteVideo');
  if (varSel === 'SVel' || varSel === 'BVel') {
    zoomContainerVideo.style.display = 'block';
    note.style.display = 'block';
  } else {
    zoomContainerVideo.style.display = 'none';
    note.style.display = 'none';
  }
}

videoVar.onchange = updateVideo;
zoomLevelVideo.onchange = updateVideo;

// =========================
// モード切り替え
// =========================
const imageMode = document.getElementById('imageMode');
const videoMode = document.getElementById('videoMode');
const imageModeBtn = document.getElementById('imageModeBtn');
const videoModeBtn = document.getElementById('videoModeBtn');

imageModeBtn.onclick = () => {
  imageMode.style.display = 'block';
  videoMode.style.display = 'none';
  imageModeBtn.classList.add('active');
  videoModeBtn.classList.remove('active');
};

videoModeBtn.onclick = () => {
  imageMode.style.display = 'none';
  videoMode.style.display = 'block';
  videoModeBtn.classList.add('active');
  imageModeBtn.classList.remove('active');
};

// =========================
// 初期化
// =========================
window.addEventListener('DOMContentLoaded', () => {
  loadImageList();
  updateVideo();
});
</script>
</body>
</html>
